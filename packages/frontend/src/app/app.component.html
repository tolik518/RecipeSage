<ngx-loading-bar [includeSpinner]="false"></ngx-loading-bar>

<ion-app [class.tab-bar-visible]="showTabBar">
  <ion-split-pane
    contentId="main-content"
    [disabled]="
      inCookMode || !isLoggedIn || !preferences[preferenceKeys.EnableSplitPane]
    "
    when="(min-width: 1024px)"
  >
    <ion-menu
      (ionWillOpen)="updateNavList()"
      [disabled]="inCookMode"
      [swipeGesture]="menuSwipeEnabled"
      contentId="main-content"
      type="overlay"
      [class]="{
        cookingToolbarOpen: cookingToolbarService.pinnedRecipes.length > 0,
      }"
    >
      <ion-header>
        <ion-toolbar color="nav">
          <ion-title>
            @if (isSelfHost) {
              <span>RecipeSage</span>
            }
            @if (!isSelfHost) {
              <img
                src="assets/recipesage-white-trimmed.png"
                alt="RecipeSage"
                style="display: inline-block"
                height="40px"
              />
            }
          </ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content>
        <ion-list>
          @for (p of navList; track p) {
            <ion-menu-toggle auto-hide="false">
              <ion-item
                [routerDirection]="'root'"
                [routerLink]="[p.url]"
                [replaceUrl]="true"
                [class.nav-active]="isNavActive(p)"
                [attr.aria-current]="isNavActive(p) ? 'page' : null"
              >
                <ion-icon slot="start" [name]="p.icon"></ion-icon>
                <ion-label class="ion-text-wrap">
                  {{ p.title }}
                </ion-label>
                @if (p.id === "people" && peopleBadgeCount) {
                  <ion-badge>{{ peopleBadgeCount }}</ion-badge>
                }
              </ion-item>
            </ion-menu-toggle>
          }
        </ion-list>
      </ion-content>

      <ion-footer>
        <ion-toolbar>
          <p class="ion-padding-start">
            {{ version }}<br />
            <ion-menu-toggle auto-hide="false">
              <a [routerLink]="[aboutDetailsHref]">Julian Poyourow</a>
            </ion-menu-toggle>
          </p>
        </ion-toolbar>
      </ion-footer>
    </ion-menu>
    <ion-router-outlet
      id="main-content"
      (stackDidChange)="updateMenuSwipe()"
      [animated]="enableAnimations"
      [class]="{
        cookingToolbarOpen: cookingToolbarService.pinnedRecipes.length > 0,
        tabBarOpen: showTabBar,
      }"
    ></ion-router-outlet>

    @if (cookingToolbarService.pinnedRecipes.length > 0) {
      <cooking-toolbar
        [style.bottom]="showTabBar ? 'var(--rs-tab-bar-height)' : null"
      ></cooking-toolbar>
    }

    @if (showTabBar) {
      <nav
        class="app-tab-bar"
        [attr.aria-label]="'pages.app.tabs.label' | translate"
      >
        <button
          type="button"
          [class.active]="activeTab === 'recipes'"
          [attr.aria-current]="activeTab === 'recipes' ? 'page' : null"
          (click)="goToTab('recipes')"
        >
          <ion-icon name="book-outline" aria-hidden="true"></ion-icon>
          <span>{{ "pages.app.tabs.recipes" | translate }}</span>
        </button>
        <button
          type="button"
          [class.active]="activeTab === 'shopping'"
          [attr.aria-current]="activeTab === 'shopping' ? 'page' : null"
          (click)="goToTab('shopping')"
        >
          <ion-icon name="cart-outline" aria-hidden="true"></ion-icon>
          <span>{{ "pages.app.tabs.shopping" | translate }}</span>
        </button>
        <button
          type="button"
          [class.active]="activeTab === 'meals'"
          [attr.aria-current]="activeTab === 'meals' ? 'page' : null"
          (click)="goToTab('meals')"
        >
          <ion-icon name="calendar-outline" aria-hidden="true"></ion-icon>
          <span>{{ "pages.app.tabs.meals" | translate }}</span>
        </button>
        <button
          type="button"
          [class.active]="activeTab === 'more'"
          (click)="goToTab('more')"
        >
          <ion-icon name="menu-outline" aria-hidden="true"></ion-icon>
          <span>{{ "pages.app.tabs.more" | translate }}</span>
        </button>
      </nav>
    }
  </ion-split-pane>
</ion-app>
